# Separate from docker-publish.yml on purpose: this image's version is the Playwright release it
# ships, which moves independently of this repository's own ci-cd releases.
#
# Tag format:  playwright-server-v<playwright-version>-<revision>
#     example:  playwright-server-v1.57.0-2
#
# The revision exists because the image can need a rebuild without Playwright having moved - a
# base image CVE, a fix to the entrypoint, a new package. Without it there is no way to express
# "same Playwright, newer image" and the only options are mutating a published tag or lying
# about the Playwright version.
name: Playwright server to Docker Hub

on:
  push:
    tags:
      - "playwright-server-v*"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Parse and validate tag
        # Fails the run on a malformed tag rather than publishing something mislabelled, since a
        # wrong version here is exactly what the client/server protocol check will reject later,
        # after the image has already been published under the wrong name.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          REST="${TAG#playwright-server-v}"
          if [[ "$REST" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            PLAYWRIGHT_VERSION="${BASH_REMATCH[1]}"
            REVISION="${BASH_REMATCH[2]}"
          elif [[ "$REST" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            # Tags published before the revision scheme existed are revision 1.
            PLAYWRIGHT_VERSION="${BASH_REMATCH[1]}"
            REVISION="1"
          else
            echo "::error::Tag '${TAG}' is malformed. Expected playwright-server-v<x.y.z>-<revision>, e.g. playwright-server-v1.57.0-2"
            exit 1
          fi
          echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION}" >> $GITHUB_ENV
          echo "REVISION=${REVISION}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${PLAYWRIGHT_VERSION}-${REVISION}" >> $GITHUB_ENV
          echo "Playwright ${PLAYWRIGHT_VERSION}, image revision ${REVISION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile_playwright_server
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          # arm64 so the image is usable on Apple Silicon for local development; the servers
          # it runs on are x86_64.
          platforms: linux/amd64,linux/arm64
          build-args: |
            PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
          # Two tags: the revision-qualified one is immutable and is what deployments pin; the
          # bare Playwright version moves to the newest revision, which is safe because the part
          # that has to match the client - the Playwright version - is still fixed.
          # There is deliberately no `latest`: it would silently change the Playwright version
          # and break the client/server match.
          tags: |
            ${{ secrets.DOCKER_HUB_ORGANIZATION_NAME }}/playwright-server:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_HUB_ORGANIZATION_NAME }}/playwright-server:${{ env.PLAYWRIGHT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        # Pulls back what was just pushed rather than testing a local build, so this exercises
        # the actual artifact. A server that is unpinned or mismatched fails the connect with
        # 428 Precondition Required, which is the failure this image exists to prevent.
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.DOCKER_HUB_ORGANIZATION_NAME }}/playwright-server:${{ env.IMAGE_TAG }}"
          docker pull "$IMAGE"
          docker run -d --name pw --shm-size 1g -p 4444:4444 -p 7900:7900 "$IMAGE"

          for _ in $(seq 1 45); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' pw)" = "healthy" ]; then break; fi
            sleep 2
          done
          STATUS="$(docker inspect --format '{{.State.Health.Status}}' pw)"
          if [ "$STATUS" != "healthy" ]; then
            echo "::error::container never became healthy (status: $STATUS)"
            docker logs pw | tail -40
            exit 1
          fi

          npm install --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
          node -e "
            const { chromium } = require('playwright');
            const connect = (o, timeout) => chromium.connect(
              'ws://localhost:4444/pw?launch-options=' + encodeURIComponent(JSON.stringify(o)),
              { timeout: timeout || 30000 });
            (async () => {
              const b = await connect({ channel: 'chromium', args: ['--no-sandbox', '--disable-blink-features=AutomationControlled', '--user-agent=SmokeProbe/1.0'] });
              const p = await b.newPage();
              await p.setContent('<h1 id=ok>ok</h1>');
              if (await p.textContent('#ok') !== 'ok') throw new Error('page did not render');
              const seen = await p.evaluate(() => ({ ua: navigator.userAgent, wd: navigator.webdriver }));
              await b.close();
              // From Playwright 1.60 the server drops client args unless run with --unsafe, and
              // this image patches that back in for args alone. An image whose patch silently
              // no-opped still renders pages perfectly, so only these two assertions catch it.
              if (!seen.ua.startsWith('SmokeProbe/')) throw new Error('launch-options args did not reach the browser');
              if (seen.wd !== false) throw new Error('navigator.webdriver was not suppressed by the args');
              // The other half of the contract: executablePath must stay gated. --unsafe would
              // ungate it, and on an unauthenticated server that is arbitrary command execution.
              let gated = true;
              try {
                const ep = await connect({ channel: 'chromium', args: ['--no-sandbox'], executablePath: '/bin/sh' }, 60000);
                await ep.close();
              } catch (e) {
                gated = false;
              }
              if (!gated) throw new Error('executablePath was honoured - the server is running unsafely');
              console.log('client ${{ env.PLAYWRIGHT_VERSION }} connected, rendered, args applied, executablePath gated');
            })().catch(e => { console.error(e); process.exit(1); });
          "
          curl -sf -o /dev/null http://localhost:7900/vnc.html || { echo '::error::noVNC not serving'; exit 1; }
          docker rm -f pw

      - name: push README to Dockerhub
        uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_HUB_PASSWORD }}
        with:
          destination_container_repo: ${{ secrets.DOCKER_HUB_ORGANIZATION_NAME }}/playwright-server
          provider: dockerhub
          readme_file: 'README_playwright_server.md'

      - name: Summary
        run: |
          {
            echo "### playwright-server ${{ env.IMAGE_TAG }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Playwright | ${{ env.PLAYWRIGHT_VERSION }} |"
            echo "| Image revision | ${{ env.REVISION }} |"
            echo "| Immutable tag | \`${{ env.IMAGE_TAG }}\` |"
            echo "| Moving tag | \`${{ env.PLAYWRIGHT_VERSION }}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo "| Digest | ${{ steps.docker_build.outputs.digest }} |"
          } >> $GITHUB_STEP_SUMMARY
