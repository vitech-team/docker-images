# Separate from docker-publish.yml on purpose: this image's tag is the Playwright version it
# ships, which moves independently of this repository's own ci-cd releases. A dedicated tag
# prefix keeps the two release streams from triggering each other.
name: Playwright server to Docker Hub

on:
  push:
    tags:
      - "playwright-server-v*.*.*"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set env
        # playwright-server-v1.57.0 -> 1.57.0, which is both the image tag and the Playwright
        # version the server runs, so a consumer can read compatibility off the tag alone.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "RELEASE_VERSION=${TAG#playwright-server-v}" >> $GITHUB_ENV

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-playwright-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-playwright-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile_playwright_server
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          build-args: |
            PLAYWRIGHT_VERSION=${{ env.RELEASE_VERSION }}
          tags: ${{ secrets.DOCKER_HUB_ORGANIZATION_NAME }}/playwright-server:${{ env.RELEASE_VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Smoke test the published image
        # The image is only useful if a client of the matching version can actually connect.
        # A mismatched or unpinned server fails this with 428 Precondition Required, which is
        # the failure mode this image exists to prevent.
        run: |
          docker run -d --name pw --shm-size 1g -p 4444:4444 -p 7900:7900 \
            ${{ secrets.DOCKER_HUB_ORGANIZATION_NAME }}/playwright-server:${{ env.RELEASE_VERSION }}
          for i in $(seq 1 30); do
            if docker exec pw bash -c 'echo > /dev/tcp/127.0.0.1/4444' 2>/dev/null; then break; fi
            sleep 2
          done
          npm install --no-save playwright@${{ env.RELEASE_VERSION }}
          node -e "
            const { chromium } = require('playwright');
            const opts = encodeURIComponent(JSON.stringify({ channel: 'chromium', args: ['--no-sandbox'] }));
            (async () => {
              const b = await chromium.connect('ws://localhost:4444/pw?launch-options=' + opts);
              const p = await b.newPage();
              await p.setContent('<h1 id=ok>ok</h1>');
              if (await p.textContent('#ok') !== 'ok') throw new Error('page did not render');
              await b.close();
              console.log('smoke test passed against server', '${{ env.RELEASE_VERSION }}');
            })().catch(e => { console.error(e); process.exit(1); });
          "
          curl -sf -o /dev/null http://localhost:7900/vnc.html || { echo 'noVNC not serving'; exit 1; }
          docker rm -f pw

      - name: push README to Dockerhub
        uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_HUB_PASSWORD }}
        with:
          destination_container_repo: ${{ secrets.DOCKER_HUB_ORGANIZATION_NAME }}/playwright-server
          provider: dockerhub
          readme_file: 'README_playwright_server.md'

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
